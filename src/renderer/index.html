<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Renderer</title>
  <style>
    /* 重置样式 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* 页面样式 */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020617;
    }

    /* Canvas 容器 */
    #canvas-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Canvas 样式 */
    #canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="canvas"></canvas>
  </div>

  <!--
    Three.js 和渲染器脚本将通过 esbuild 打包
    打包后的文件位于 public/renderer/renderer.js
  -->
  <script type="module" src="./renderer.js"></script>
</body>
</html>
